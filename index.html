      content="Hide secret Unicode, QR code, and AES-GCM encrypted messages inside ordinary images using 100% browser-based LSB steganography."

    <meta property="og:title" content="Ghostpix — Hide a secret in plain sight." />

    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('ghostpix-theme');
          if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
